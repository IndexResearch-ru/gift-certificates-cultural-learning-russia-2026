name: "Gift certificates: one-time live responsive QA"
on:
  push:
    paths:
      - ".github/workflows/gifts-live-qa.yml"
      - "scripts/qa_live_gifts.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run-live-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated browser for read-only QA
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check production pages at four widths without visiting affiliate links
        run: |
          python scripts/qa_live_gifts.py
      - name: Save screenshot and JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gifts-live-qa-2026-11-05
          path: qa_live_gifts_artifacts/
          if-no-files-found: warn
          retention-days: 30
